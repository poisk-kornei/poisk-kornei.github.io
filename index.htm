<form action="https://web3forms.com" method="POST">
    <!-- Ключ доступа и возврат на сайт -->
    <input type="hidden" name="access_key" value="b635650e-c032-4efa-8d65-30948f1308a7">
    <input type="hidden" name="redirect" value="https://github.io">
    
    <!-- Поле: Имя -->
    <input type="text" name="name" class="form-input-field" placeholder="Ваше имя" required>
    
    <!-- Поле: Контакты -->
    <input type="text" name="contact" class="form-input-field" placeholder="Телефон / Telegram / WhatsApp" required>
    
    <!-- Поле: Email -->
    <input type="email" name="form_email" class="form-input-field" placeholder="Email для связи" required>
    
    <!-- НОВОЕ: Выбор направления поиска -->
    <select name="root_type" class="form-input-field" style="background-color: rgba(255,255,255,0.08); color: #ffffff; border: 2px solid rgba(255,255,255,0.15); webkit-appearance: none; cursor: pointer;" required>
        <option value="" disabled selected style="color: #111111;">Какую национальность ищете?</option>
        <option value="Польские корни" style="color: #111111;">Польские корни (Карта поляка)</option>
        <option value="Еврейские корни" style="color: #111111;">Еврейские корни</option>
        <option value="Немецкие корни" style="color: #111111;">Немецкие корни</option>
        <option value="Сложный кейс / Другое" style="color: #111111;">Сложный кейс (Восстановление родства)</option>
    </select>

    <!-- НОВОЕ: Галочка про готовность дать доверенность -->
    <div style="margin-bottom: 20px; text-align: left; padding-left: 10px; font-size: 0.9rem; color: #e3ddff; display: flex; align-items: center; gap: 10px;">
        <input type="checkbox" name="agreement_document" id="agree_doc" value="Да, готов предоставить доверенность" style="width: auto; margin: 0; cursor: pointer;">
        <label for="agree_doc" style="cursor: pointer;">Готов предоставить доверенность для ЗАГС/Архива</label>
    </div>
    
    <!-- Поле: Детали поиска -->
    <textarea name="message" rows="4" class="form-input-field form-textarea" placeholder="Известные данные предков (ФИО, годы и места рождения/проживания в Беларуси)" required></textarea>
    
    <!-- Кнопка отправить -->
    <button type="submit" class="btn-submit-neon">Отправить запрос</button>
</form>
