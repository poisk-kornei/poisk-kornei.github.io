<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Архивный поиск предков | Польские, еврейские, немецкие корни</title>
    <style>
        /* Стилизация с анимациями (fadeIn) и эффектами при наведении (transition) */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: #f4f7f6; color: #333; }
        .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
        .hero { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white; text-align: center; padding: 80px 20px; animation: fadeIn 1s ease-out; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: all 0.3s ease; animation: fadeIn 1.2s ease-out; }
        .card:hover { transform: translateY(-8px); box-shadow: 0 12px 24px rgba(0,0,0,0.15); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
        .form-container { max-width: 550px; margin: 0 auto; background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center; }
        /* Интерактивные рамки */
        .form-group input, .form-group textarea { width: 100%; padding: 14px; border: 2px solid #ced4da; border-radius: 8px; transition: all 0.3s ease; box-sizing: border-box; }
        .form-group input:focus, .form-group textarea:focus { border-color: #2a5298; box-shadow: 0 0 0 4px rgba(42, 82, 152, 0.15); outline: none; }
        .btn-submit { background: #2a5298; color: white; border: none; padding: 15px 30px; border-radius: 8px; cursor: pointer; transition: all 0.3s ease; width: 100%; }
        .btn-submit:hover { background: #1e3c72; transform: scale(1.02); }
    </style>
</head>
<body>
    <header class="hero"><h1>Архивный поиск предков</h1></header>
    <section class="container">
        <div class="grid">
            <div class="card"><h3>🔍 Глубокий анализ</h3></div>
            <div class="card"><h3>📄 Официальные запросы</h3></div>
        </div>
        <div id="order-form" class="form-container">
            <h2>Оставить запрос</h2>
            <form action="https://web3forms.com" method="POST">
                <input type="hidden" name="access_key" value="b635650e-c032-4efa-8d65-30948f1308a7">
                <div class="form-group"><input type="text" name="name" placeholder="Ваше имя" required></div>
                <div class="form-group"><textarea name="message" placeholder="Ваша ситуация" required></textarea></div>
                <button type="submit" class="btn-submit">Начать поиск</button>
            </form>
        </div>
    </section>
</body>
</html>
