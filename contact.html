<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отправить запрос | Поиск корней</title>
    <style>
        body { font-family: sans-serif; background-color: #0d0b21; color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .box { background: #4f33ff; padding: 40px; border-radius: 24px; max-width: 500px; width: 100%; box-sizing: border-box; text-align: center; }
        input, textarea { width: 100%; padding: 16px; margin-bottom: 16px; border-radius: 50px; border: none; box-sizing: border-box; font-size: 1rem; }
        textarea { border-radius: 20px; resize: none; }
        button { width: 100%; padding: 18px; background: #ff33b8; color: #fff; font-weight: bold; text-transform: uppercase; border: none; border-radius: 50px; cursor: pointer; font-size: 1rem; }
    </style>
</head>
<body>

    <div class="box">
        <h2>Анкета поиска предков</h2>
        <p style="color: #e3ddff; margin-bottom: 30px;">Заполните данные, чтобы отправить запрос на поиск в архивах Беларуси</p>
        
        <form action="https://web3forms.com" method="POST">
            <input type="hidden" name="access_key" value="b635650e-c032-4efa-8d65-30948f1308a7">
            <input type="hidden" name="redirect" value="https://github.io">

            <input type="text" name="name" placeholder="Ваше имя" required>
            <input type="text" name="contact" placeholder="Телефон / Telegram / WhatsApp" required>
            <input type="email" name="email" placeholder="Email для связи" required>
            <textarea name="message" rows="5" placeholder="Кого вы ищете? (ФИО предков, годы, места рождения)" required></textarea>
            
            <button type="submit">Отправить запрос</button>
        </form>
    </div>

</body>
</html>
